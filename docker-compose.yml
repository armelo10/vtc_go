services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vtc
      POSTGRES_USER: vtc
      POSTGRES_PASSWORD: vtc
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./migrations:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vtc -d vtc"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
