name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Format check
        run: |
          files="$(gofmt -l backend)"
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -buildvcs=false ./...
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vtc
          POSTGRES_USER: vtc
          POSTGRES_PASSWORD: vtc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vtc -d vtc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify PostGIS
        env:
          PGPASSWORD: vtc
        run: |
          psql -h localhost -U vtc -d vtc -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U vtc -d vtc -c "SELECT PostGIS_Version();"
